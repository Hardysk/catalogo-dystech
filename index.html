<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Catálogo de productos DYSTECH – Encuentra los mejores productos tecnológicos al mejor precio."/>
  <title>DYSTECH | Catálogo de Productos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

  <!-- ======== HEADER ======== -->
  <header class="header" id="header">
    <div class="header-inner">

      <div class="header-left">

        <!-- BOTÓN MENU -->
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
          <span></span>
          <span></span>
          <span></span>
          <span class="filter-badge" id="filterBadge" style="display: none;">0</span>
        </button>

        <!-- LOGO -->
        <a href="#" class="logo" id="logoLink">
          <h1>DYSTECH</h1>
          <span class="logo-sub">Catálogo de productos</span>
        </a>

      </div>

      <div class="header-right">

        <!-- SEARCH -->
        <div class="search-wrapper" id="searchWrapper">

          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>

          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por nombre o código…"
            autocomplete="off"
          >
        </div>

        <!-- CARRITO -->
        <button class="cart-btn" id="cartBtn" aria-label="Ver carrito">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>

          <span
            class="cart-badge"
            id="cartBadge"
            style="display:none;"
          >
            0
          </span>

        </button>

      </div>

    </div>
  </header>

  <!-- =====================================
       MENU LATERAL IZQUIERDO
  ====================================== -->

  <!-- BACKDROP -->
  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- SIDEBAR -->
  <aside class="nav" id="navMenu">

    <div class="nav-inner">

      <!-- TITULO -->
      <div class="nav-title">
        <h3>Filtros</h3>
        <button class="nav-close" id="navClose" aria-label="Cerrar filtros">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- FILTROS (Ocultos pero presentes para compatibilidad de estado con JS original) -->
      <div class="filtros-container" style="display: none;">

        <div class="filtros-selects">

          <!-- LISTAS -->
          <select id="filtroLista">
            <option value="">Todas las listas</option>
          </select>

          <!-- CATEGORIAS -->
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
          </select>

          <!-- SUBCATEGORIAS -->
          <select id="filtroSubcategoria">
            <option value="">Todas las subcategorías</option>
          </select>

        </div>

        <!-- BOTON LIMPIAR -->
        <button
          id="limpiarFiltros"
          class="btn-limpiar-filtros"
          style="display:none;"
        >
          Limpiar filtros
        </button>

      </div>

      <!-- Contenedor dinámico de filtros acordeón para versión móvil -->
      <div class="mobile-filtros-wrapper" id="mobileFiltrosContainer">
        <!-- Dinámico -->
      </div>

    </div>

  </aside>

  <!-- ======== MAIN ======== -->
  <main class="main-content">

    <div class="container">

      <!-- ======== FILTROS HORIZONTALES (Mercado Libre Style - Jerárquico) ======== -->
      <div class="horizontal-menu-wrapper" id="horizontalMenuWrapper">
        <!-- Listas horizontales -->
        <div class="lista-tabs-container">
          <div class="lista-tabs" id="listaTabs">
            <!-- Dinámico -->
          </div>
        </div>
      </div>

      <!-- Contenedor unificado para el dropdown jerárquico flotante (Categorías > Subcategorías) -->
      <div class="filtro-dropdown-wrapper" id="filtroDropdownWrapper" style="display: none;">
        <!-- Dinámico -->
      </div>

      <!-- FILTROS ACTIVOS (Pills) -->
      <div class="active-filters-wrapper" id="activeFiltersWrapper" style="display: none;">
        <span class="active-filters-title">Filtros activos:</span>
        <div class="active-filters-pills" id="activeFiltersPills"></div>
        <button class="btn-limpiar-top" id="limpiarFiltrosTop">Limpiar todo</button>
      </div>

      <!-- PRODUCT COUNT -->
      <p class="product-count" id="productCount"></p>

      <!-- PRODUCTOS -->
      <div id="productosGrid" class="productos-grid"></div>

    </div>

  </main>

  <!-- ======== PRODUCT MODAL ======== -->
  <div class="modal-overlay" id="modalOverlay">

    <div class="modal" id="productModal" role="dialog" aria-modal="true">

      <button class="modal-close" id="modalClose" aria-label="Cerrar">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>

      </button>

      <div class="modal-body">

        <div class="modal-image-wrapper">
          <img id="modalImg" src="" alt="">
        </div>

        <div class="modal-info">

          <span class="modal-code" id="modalCodigo"></span>

          <h2 class="modal-name" id="modalNombre"></h2>

          <p class="modal-spec" id="modalEspecificacion"></p>

          <div class="modal-meta" id="modalMeta">
            <!-- Marca, Modelo, Unidad -->
          </div>

          <div class="modal-price-stock">

            <div class="modal-price" id="modalPrecio"></div>

            <div class="modal-stock" id="modalStock"></div>

          </div>

          <hr class="modal-divider">

          <div class="modal-actions">

            <div class="qty-selector">

              <button
                class="qty-btn"
                id="qtyMinus"
                aria-label="Reducir cantidad"
              >
                &minus;
              </button>

              <input
                type="number"
                class="qty-input"
                id="qtyInput"
                value="1"
                min="1"
              >

              <button
                class="qty-btn"
                id="qtyPlus"
                aria-label="Aumentar cantidad"
              >
                +
              </button>

            </div>

            <button class="add-to-cart-btn" id="addToCartBtn">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>

              Agregar al carrito

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- ======== CART DRAWER ======== -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras">

    <div class="cart-drawer-header">

      <h2>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>

        Mi Carrito

      </h2>

      <button class="cart-drawer-close" id="cartDrawerClose" aria-label="Cerrar carrito">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>

      </button>

    </div>

    <div class="cart-drawer-body" id="cartItemsContainer">

      <div class="cart-empty" id="cartEmpty">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>

        <p>Tu carrito está vacío</p>

        <span>Agrega productos para empezar</span>

      </div>

    </div>

    <div class="cart-drawer-footer" id="cartFooter" style="display:none;">

      <div class="cart-total-row">
        <span>Total</span>
        <span class="cart-total-value" id="cartTotal">$0</span>
      </div>

      <button class="checkout-btn" id="checkoutBtn">

        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/>
        </svg>

        Comprar por WhatsApp

      </button>

    </div>

  </aside>

  <!-- ======== TOAST ======== -->
  <div class="toast" id="toast">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>

    <span id="toastMsg">
      Producto agregado al carrito
    </span>

  </div>

  <script src="app.js"></script>

</body>
</html>
